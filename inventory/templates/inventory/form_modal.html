<form method="post">
  {% csrf_token %}
  <div class="row g-3">
    {% for field in form %}
      <div class="{% if field.name == 'description' %}col-12{% else %}col-md-6{% endif %}">
        {% if field.field.widget.input_type == "checkbox" %}
          <div class="form-check mt-4">
            {{ field }}
            <label class="form-check-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
          </div>
        {% else %}
          <label class="form-label small mb-1" for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
        {% endif %}
        {% if field.help_text %}<div class="text-muted small">{{ field.help_text }}</div>{% endif %}
        {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
      </div>
    {% endfor %}
  </div>
  <div class="mt-3 d-flex gap-2 justify-content-end">
    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
    <button type="submit" class="btn btn-tez">Save</button>
  </div>
</form>
